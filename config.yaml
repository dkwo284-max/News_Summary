# Daily Brief 설정 파일
# 피드 추가/삭제, 섹션별 건수, 타임존, 가중치 키워드를 여기서 관리합니다.

# ── 실행 시각 ───────────────────────────────────────────────
# 뉴질랜드 시간 매일 아침 07시대에 브리핑을 만듭니다(서머타임 자동 반영).
# 워크플로가 07:05 / 07:20 / 07:35 (현지) 쯤 깨어나고, 그날 브리핑이 아직 없을 때 첫 실행이 생성합니다.
# GitHub 예약 실행은 가끔 누락되므로 3번 깨우는 것이고, 이미 생성됐으면 나머지는 몇 초 만에 끝납니다.
# 한국 시간으로 돌리려면 timezone 을 "Asia/Seoul" 로 바꾸고 .github/workflows/daily.yml 의 cron 시각도 바꾸세요.
timezone: "Pacific/Auckland"
run_hour: 7
catchup_until_hour: 8    # 07:00~07:59 사이에만 생성 (8시 전에 준비)

# ── 수집 ────────────────────────────────────────────────────
fetch:
  lookback_hours: 24
  max_items_per_feed: 30
  timeout_seconds: 20
  user_agent: "Mozilla/5.0 (compatible; DailyBriefBot/1.0; +https://github.com/dkwo284-max/News_Summary)"
  extract_body: true          # 상위 기사 본문 일부를 요약 입력으로만 사용 (저장하지 않음)
  body_chars: 1500

dedupe:
  title_similarity: 85        # rapidfuzz token_set_ratio 임계값

# ── 데이터 보관 ─────────────────────────────────────────────
output:
  data_dir: "web/public/data"
  retention_days: 30
  app_url: "https://dkwo284-max.github.io/News_Summary/"

# ── 섹션 ────────────────────────────────────────────────────
# region: kr | nz  (nz 섹션은 "이민자 관점(why_it_matters)"을 생성)
# candidate_limit: AI 선별 단계에 보낼 최대 후보 수 (지역별 합계가 rank_batch_size 이하면 선별 요청 1회)
sections:
  kr_society:       { label: "사회",     region: kr, top_n: 5, candidate_limit: 45 }
  kr_economy:       { label: "경제",     region: kr, top_n: 5, candidate_limit: 45 }
  kr_entertainment: { label: "연예",     region: kr, top_n: 5, candidate_limit: 45 }
  kr_politics:      { label: "정치",     region: kr, top_n: 5, candidate_limit: 45 }
  # 뉴질랜드 전국 기사는 nz_national 한 묶음으로 수집·선별한 뒤, AI 분류(category)에 따라 아래 4개 섹션으로 나눕니다.
  nz_national:      { label: "뉴질랜드", region: nz, pool: true, top_n: 18, candidate_limit: 120 }
  nz_society:       { label: "사회", region: nz, from: nz_national, category: society,   top_n: 5 }
  nz_education:     { label: "교육", region: nz, from: nz_national, category: education, top_n: 4 }
  nz_economy:       { label: "경제", region: nz, from: nz_national, category: economy,   top_n: 5 }
  nz_politics:      { label: "정치", region: nz, from: nz_national, category: politics,  top_n: 4 }
  nz_auckland:      { label: "오클랜드", region: nz, top_n: 5, candidate_limit: 60 }
  # nz_immigration(이민 레이더)은 이민 전용 피드 + 뉴질랜드/오클랜드 후보 중 독자 프로필(아래 profile) 관련도가 높은 기사.
  # 레이더에 실린 기사는 뉴질랜드/오클랜드 탭에서 빠집니다(중복 없음).
  nz_immigration:   { label: "이민 레이더", region: nz, top_n: 6, candidate_limit: 40 }

# ── 뉴질랜드/오클랜드 가중치 (이민 준비자 관점) ───────────────
# 선별 프롬프트와 API 없이 돌릴 때(--no-llm)의 키워드 점수에 함께 쓰입니다.
weights:
  high:
    - { topic: "이민/비자 정책", keywords: [immigration, visa, "skilled migrant", "green list", "work visa", residence, residency, "accredited employer", AEWV, INZ, migrant, citizenship] }
    - { topic: "고용·임금·실업", keywords: [jobs, employment, unemployment, wage, wages, salary, "labour market", "minimum wage", layoffs, hiring] }
    - { topic: "주거·금리", keywords: [rent, rents, housing, "house prices", mortgage, OCR, "interest rate", "Reserve Bank", RBNZ, property, Kāinga Ora] }
    - { topic: "생활비·물가", keywords: [inflation, CPI, "cost of living", prices, petrol, groceries, power bills] }
    - { topic: "환율", keywords: [NZD, "kiwi dollar", "exchange rate", currency, KRW, won] }
    - { topic: "교육", keywords: [school, schools, education, university, NCEA, students, "international students"] }
    - { topic: "의료", keywords: [health, hospital, "Health NZ", "Te Whatu Ora", GP, "emergency department"] }
    - { topic: "치안", keywords: [crime, police, burglary, "ram raid", assault, safety] }
    - { topic: "기상재해", keywords: [flood, flooding, storm, cyclone, earthquake, "state of emergency", MetService, "red warning", "orange warning"] }
  low:
    - { topic: "스포츠", keywords: [rugby, "All Blacks", cricket, netball, "Black Caps", match, score, "Super Rugby", NRL, Warriors] }
    - { topic: "연예 가십", keywords: [celebrity, Bachelor, reality, gossip, Kardashian] }

# ── 제외할 기사 ─────────────────────────────────────────────
# 제목에 아래 단어가 있거나 출처가 아래 목록이면 수집 단계에서 아예 뺍니다 (대소문자 무시, 영어는 단어 단위).
# 키워드로 못 거른 개인 사연·매물·광고성 기사는 AI 가 한 번 더 걸러냅니다(junk 판정).
exclude:
  title_keywords:
    # 개인 사연·모금
    - Givealittle
    - GoFundMe
    - fundraiser
    - fundraising
    - "fundraising page"
    - heartbreaking story
    - "투병기"
    - "사연"
    - "모금"
    # 부동산 매물·분양
    - "for sale"
    - "on the market"
    - "open home"
    - "property of the week"
    - "dream home"
    - "mortgage-free"
    - sqm
    - "m²"
    - "bedroom home"
    - "bedroom house"
    - "매물"
    - "분양"
    - "모델하우스"
    # 광고·협찬·홍보
    - sponsored
    - advertorial
    - "paid partnership"
    - "in partnership with"
    - promo code
    - giveaway
    - "Black Friday"
    - "deal of the day"
    - "[광고]"
    - "[AD]"
    - "협찬"
    - "할인 이벤트"
    - "특가"
    - "PR보도"
  sources:
    - OneRoof            # 부동산 매물·홍보 기사 위주
    - "Simply Wall St"
    - "Simply Wall Street"
    - "Yahoo Finance"
    - "Legit.ng"         # 해외 재가공 기사

# ── 독자 프로필 (이민 레이더 기준 + "이민자 관점" 문구에 반영) ──────────
profile:
  summary: >-
    오클랜드대학교(UoA) 석사 과정을 곧 졸업하는 한국인 유학생(현재 학생비자). 졸업 후 뉴질랜드에서 취업해 영주권까지
    받는 것이 목표. 관심: 졸업 후 취업비자(Post Study Work Visa), 취업비자(AEWV·Accredited Employer, Green List 직종),
    영주권(Skilled Migrant Category, Green List Straight to Residence / Work to Residence), 시민권, 이민 규정 변경과
    처리 기간·수수료, 졸업생 취업시장. 관심 낮음: 신규 유학생 학생비자 발급·유학생 모집, 관광·방문비자, 계절근로(RSE),
    다른 나라의 이민 정책.
  radar_min_score: 5     # 레이더 관련도(0~10)가 이 점수 이상인 기사만 이민 레이더에 표시
  radar_high:            # AI 없이 돌 때 레이더 점수를 높게 줄 키워드
    - "post study work"
    - "post-study work"
    - PSWV
    - graduate
    - graduates
    - AEWV
    - "accredited employer"
    - "work visa"
    - "green list"
    - "skilled migrant"
    - SMC
    - residence
    - residency
    - "resident visa"
    - "straight to residence"
    - "work to residence"
    - citizenship
    - "median wage"
  radar_low:             # 제목에 이 키워드가 있고 radar_high 키워드가 없으면 AI 점수와 상관없이 레이더 관련도를 3 이하로
    - "student visa"
    - "student visas"
    - "study visa"
    - "study visas"
    - "international student"
    - "international students"
    - "visitor visa"
    - tourist
    - RSE
    - "seasonal workers"
    - "working holiday"
    - "Cook Islands"
    - "Express Entry"
    - Canada
    - Canadian
    - Australia
    - "UK visa"
    - forum
    - webinar
    - conference
    - seminar

# ── 뉴질랜드 카테고리 (AI 없이 돌 때 분류 키워드, 해당 없으면 사회) ──────────
nz_categories:
  education: [school, schools, "primary school", "intermediate school", pupils, students, teacher, teachers, principal, principals, curriculum, NCEA, ERO, kindergarten, "early childhood", "Ministry of Education", "school lunches", "Ka Ora, Ka Ako", literacy, numeracy, "school zone", enrolment]
  politics: [election, Parliament, MP, MPs, minister, Labour, National, Greens, ACT, "NZ First", "Te Pāti Māori", coalition, poll, Luxon, Hipkins, Seymour, Peters, Cabinet, bill, select committee]
  economy: [OCR, inflation, CPI, "Reserve Bank", GDP, economy, economic, business, petrol, "house prices", "housing market", mortgage, unemployment, jobs, wage, wages, KiwiSaver, "NZ dollar", budget, tax, bank, banks, Fonterra, exports, recession, "cost of living"]

# ── 뉴질랜드 / 오클랜드 탭 나누기 ─────────────────────────────
# 같은 사건은 한 탭에만 싣습니다. 오클랜드 지역 소식(시의회·교통·지역 사건사고·오클랜드 병원 등)은
# 오클랜드 탭으로, 전국 단위 소식(정책·경제·전국 통계)은 오클랜드가 언급돼도 뉴질랜드 탭으로 보냅니다.
# AI 가 판단하며, AI 없이 돌 때는 아래 키워드가 제목에 있으면 오클랜드 소식으로 봅니다.
auckland_keywords: [Auckland, "Tāmaki Makaurau", "North Shore", Manukau, "Waitematā", Waitakere, Henderson, Papakura, Ōtāhuhu, Otahuhu, Mangere, "Māngere", Albany, Takapuna, Howick, Pakuranga, Piha, "Waiheke", "Starship", "Auckland Transport", "Auckland Council", "Eden Park", "CRL", "City Rail Link"]

# ── AI 요약 ─────────────────────────────────────────────────
# provider: gemini (기본, 무료 등급) | anthropic (Claude API, 유료)
#
# Gemini 무료 등급으로 요금 0원 유지하기
#   - Google AI Studio(https://aistudio.google.com/apikey)에서 키를 만들고,
#     그 키의 Google Cloud 프로젝트에 결제(Billing)를 연결하지 마세요.
#     결제가 연결되지 않은 키는 무료 등급으로만 동작하고, 한도를 넘으면 요금 대신 429 오류가 납니다.
#   - 무료 등급 한도(분당/일일 요청 수)는 Google 이 자주 바꿉니다. AI Studio 의 Rate limit 화면에서 확인하세요.
#   - 하루 1회 실행에 보내는 요청은 보통 5회(선별 2 + NZ 이슈 묶기 1 + 요약 2)이고, max_requests_per_run 을 넘지 않습니다.
#   - 한도 초과·오류 시 그날은 AI 없이(키워드 선별 + RSS 원문 설명) 표시됩니다.
llm:
  provider: "gemini"
  max_requests_per_run: 7      # 한 번 실행에서 보낼 수 있는 최대 AI 요청 수 (무료 한도 보호). 보통 5회 + 처리기간 추출이 필요할 때 1회
  rank_batch_size: 260         # 선별 1회 요청에 넣을 최대 후보 수 (지역별 후보 합계가 이 이하면 지역당 1회)

  gemini:
    # 모델 후보 목록: 앞에서부터 시도하고, 단종·사용 불가(404)면 다음 후보로 넘어갑니다.
    # 사용 가능한 무료 모델은 AI Studio(https://aistudio.google.com) 모델 목록에서 확인하세요.
    rank_model: ["gemini-3.8-flash-lite", "gemini-flash-lite-latest", "gemini-3.8-flash", "gemini-flash-latest"]
    summary_model: ["gemini-3.8-flash", "gemini-flash-latest", "gemini-flash-lite-latest"]
    # thinking_budget: 0         # Gemini 2.5 계열에서만 사용 (사고 끔). Gemini 3 계열에서는 넣지 마세요
    min_interval_seconds: 10     # 요청 간 최소 간격 (분당 한도 보호)
    retry_wait_seconds: 60       # 429(분당 한도 초과) 시 한 번만 재시도하기 전 대기
    overload_wait_seconds: 20    # 500/503(일시 과부하) 시 재시도 전 대기. 그래도 실패하면 다음 모델 후보로
    timeout_seconds: 300         # 응답 대기 한도. 넘기면 재시도 후 다음 모델 후보로

  # 유료(Claude API) 로 바꾸려면 provider: "anthropic" + Secret ANTHROPIC_API_KEY. 구독(Pro/Max)과 별도로 청구됩니다.
  anthropic:
    rank_model: "claude-haiku-5-5"
    summary_model: "claude-sonnet-5-5"
    rank_effort: "low"
    summary_effort: "low"
    summary_fallback: true       # 안전 분류기가 거절하면 서버가 다른 모델로 자동 재시도
    pricing:                     # USD per 1M tokens — 비용 로그 계산용
      claude-haiku-5-5:  { input: 0.10, output: 0.50 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00 }

# ── 부가 정보 ───────────────────────────────────────────────
extras:
  fx: { base: "NZD", quote: "KRW" }   # frankfurter (키 불필요)
  weather: { name: "Auckland", latitude: -36.8485, longitude: 174.7633, timezone: "Pacific/Auckland" }  # Open-Meteo

# ── 이민 레이더 전광판: 비자별 처리 기간 ─────────────────────────
# 매일 INZ·DIA 공식 페이지에서 처리 기간(표 또는 "80% within 4 weeks" 같은 문장)을 찾아 표시합니다.
# urls 는 앞에서부터 시도합니다(사이트 개편 대비 후보 여러 개). 못 찾으면 AI 가 본문에서 추출하고,
# 그래도 실패하면 이전 값을 기준일과 함께 보여줍니다.
processing_times:
  # INZ 대기 시간 표(…-wait-times)는 '평균(50%)'과 '대부분(80%)' 처리 기간을 함께 보여줘서 먼저 시도합니다.
  # match 는 표에서 해당 비자 행을 찾는 이름입니다.
  - key: pswv
    group: "졸업 후"
    name: "졸업 후 취업비자 (PSWV)"
    match: "Post Study Work Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/work-visa-wait-times/"
      - "https://www.immigration.govt.nz/visas/post-study-work-visa/"
  - key: aewv
    group: "취업비자"
    name: "고용주 인증 취업비자 (AEWV)"
    match: "Accredited Employer Work Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/employer-accreditation-job-check-and-aewv-wait-times/"
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/work-visa-wait-times/"
      - "https://www.immigration.govt.nz/visas/accredited-employer-work-visa/"
  - key: smc
    group: "영주권"
    name: "숙련 이민 영주권 (SMC)"
    match: "Skilled Migrant Category Resident Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/resident-visa-wait-times/"
      - "https://www.immigration.govt.nz/visas/skilled-migrant-category-resident-visa/"
  - key: gl_str
    group: "영주권"
    name: "Green List 즉시 영주권 (Straight to Residence)"
    match: "Straight to Residence Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/resident-visa-wait-times/"
      - "https://www.immigration.govt.nz/visas/straight-to-residence-visa/"
  - key: wtr
    group: "영주권"
    name: "취업 후 영주권 (Work to Residence)"
    match: "Work to Residence Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/resident-visa-wait-times/"
      - "https://www.immigration.govt.nz/visas/work-to-residence-visa/"
  - key: pr
    group: "영주권"
    name: "영구 영주권 (Permanent Resident Visa)"
    match: "Permanent Resident Visa"
    urls:
      - "https://www.immigration.govt.nz/process-to-apply/waiting-for-a-visa/processing-a-visa-application/how-long-it-takes-to-process-an-application/resident-visa-wait-times/"
  - key: citizenship
    group: "시민권"
    name: "시민권 (Grant of Citizenship)"
    urls:
      - "https://www.govt.nz/browse/passports-citizenship-and-identity/nz-citizenship/how-to-apply-for-nz-citizenship/application-timeframes/"

# ── 알림 (선택) ─────────────────────────────────────────────
# 토큰/비밀번호는 절대 여기 적지 말고 GitHub Secrets 로만 설정하세요.
notify:
  telegram: { enabled: false }   # Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  email:    { enabled: false }   # Secrets: SMTP_USER, SMTP_PASSWORD(Gmail 앱 비밀번호), EMAIL_TO

# ── 피드 ────────────────────────────────────────────────────
# id: 고유 이름 / name: 화면에 표시할 출처명 / section: 위 sections 키
# url: 기본 피드 / fallbacks: 기본 피드가 죽었거나 0건일 때 순서대로 시도할 대체 피드
# enabled: false 로 끄기 / google_news: true 면 제목 끝 " - 언론사"를 떼고 실제 언론사명을 출처로 사용
# 피드 상태 점검: python scripts/check_feeds.py  (Actions의 "Check feeds" 워크플로로도 실행 가능)
feeds:
  # ── 한국: 연합뉴스 ──
  - { id: yna_society,       name: "연합뉴스", section: kr_society,       url: "https://www.yna.co.kr/rss/society.xml" }
  - { id: yna_economy,       name: "연합뉴스", section: kr_economy,       url: "https://www.yna.co.kr/rss/economy.xml" }
  - { id: yna_entertainment, name: "연합뉴스", section: kr_entertainment, url: "https://www.yna.co.kr/rss/entertainment.xml" }
  - { id: yna_politics,      name: "연합뉴스", section: kr_politics,      url: "https://www.yna.co.kr/rss/politics.xml" }

  # ── 한국: Google News (보조) ──
  - id: gn_kr_society
    name: "Google 뉴스"
    section: kr_society
    google_news: true
    url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=ko&gl=KR&ceid=KR:ko"
    fallbacks: ["https://news.google.com/rss/search?q=%EC%82%AC%ED%9A%8C+when:1d&hl=ko&gl=KR&ceid=KR:ko"]
  - id: gn_kr_economy
    name: "Google 뉴스"
    section: kr_economy
    google_news: true
    url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko"
    fallbacks: ["https://news.google.com/rss/search?q=%EA%B2%BD%EC%A0%9C+when:1d&hl=ko&gl=KR&ceid=KR:ko"]
  - id: gn_kr_entertainment
    name: "Google 뉴스"
    section: kr_entertainment
    google_news: true
    url: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko"
    fallbacks: ["https://news.google.com/rss/search?q=%EC%97%B0%EC%98%88+when:1d&hl=ko&gl=KR&ceid=KR:ko"]
  - id: gn_kr_politics
    name: "Google 뉴스"
    section: kr_politics
    google_news: true
    url: "https://news.google.com/rss/search?q=%EC%A0%95%EC%B9%98+when:1d&hl=ko&gl=KR&ceid=KR:ko"

  # ── 한국: 기타 언론사 (필요에 따라 enabled 조정) ──
  - { id: hani_society,   name: "한겨레",   section: kr_society,  url: "https://www.hani.co.kr/rss/society/" }
  - { id: hani_economy,   name: "한겨레",   section: kr_economy,  url: "https://www.hani.co.kr/rss/economy/" }
  - { id: hani_politics,  name: "한겨레",   section: kr_politics, url: "https://www.hani.co.kr/rss/politics/" }
  - { id: chosun_national, name: "조선일보", section: kr_society,  url: "https://www.chosun.com/arc/outboundfeeds/rss/category/national/?outputType=xml" }
  - { id: chosun_economy,  name: "조선일보", section: kr_economy,  url: "https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml" }
  - { id: chosun_politics, name: "조선일보", section: kr_politics, url: "https://www.chosun.com/arc/outboundfeeds/rss/category/politics/?outputType=xml" }
  - { id: chosun_ent,      name: "조선일보", section: kr_entertainment, url: "https://www.chosun.com/arc/outboundfeeds/rss/category/entertainments/?outputType=xml" }
  - { id: mk_economy,     name: "매일경제", section: kr_economy,  url: "https://www.mk.co.kr/rss/30100041/" }
  - { id: mk_society,     name: "매일경제", section: kr_society,  url: "https://www.mk.co.kr/rss/50400012/" }

  # ── 뉴질랜드 전국 ──
  # RNZ 는 GitHub Actions 서버에서 403 을 돌려줌(2026-10 확인) → Google News 로 대체
  - id: rnz_national
    name: "RNZ"
    section: nz_national
    url: "https://www.rnz.co.nz/rss/national.xml"
    # 섹션 경로 검색(site:rnz.co.nz/news/national)은 결과가 0건인 날이 있어(2026-10-19 확인) RNZ 전체 검색을 추가
    fallbacks:
      - "https://news.google.com/rss/search?q=site:rnz.co.nz/news/national+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
      - "https://news.google.com/rss/search?q=site:rnz.co.nz+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: rnz_business
    name: "RNZ"
    section: nz_national
    url: "https://www.rnz.co.nz/rss/business.xml"
    fallbacks: ["https://news.google.com/rss/search?q=site:rnz.co.nz/news/business+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - { id: nzh_nz,        name: "NZ Herald",  section: nz_national, url: "https://www.nzherald.co.nz/arc/outboundfeeds/rss/section/nz/?outputType=xml" }
  - { id: nzh_business,  name: "NZ Herald",  section: nz_national, url: "https://www.nzherald.co.nz/arc/outboundfeeds/rss/section/business/?outputType=xml" }
  - id: stuff_nz
    name: "Stuff"
    section: nz_national
    url: "https://www.stuff.co.nz/rss"
    fallbacks: ["https://news.google.com/rss/search?q=site:stuff.co.nz+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: onenews
    name: "1News"
    section: nz_national
    url: "https://www.1news.co.nz/arc/outboundfeeds/rss/?outputType=xml"
    fallbacks: ["https://news.google.com/rss/search?q=site:1news.co.nz+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: gn_nz_top
    name: "Google News"
    section: nz_national
    google_news: true
    url: "https://news.google.com/rss/headlines/section/topic/NATION?hl=en-NZ&gl=NZ&ceid=NZ:en"
    fallbacks: ["https://news.google.com/rss?hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: gn_nz_education
    name: "Google News"
    section: nz_national
    google_news: true
    reserve: true      # 출처 1곳짜리 기사가 많아 후보 추리기에서 밀리지 않게 항상 포함
    lookback_hours: 48
    # 교육: 초등·중간학교(primary/intermediate) 중심
    url: "https://news.google.com/rss/search?q=%22New+Zealand%22+(%22primary+school%22+OR+%22intermediate+school%22+OR+%22primary+schools%22+OR+%22Ministry+of+Education%22+OR+%22school+lunches%22+OR+teachers+OR+principals)+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: gn_nz_school
    name: "Google News"
    section: nz_national
    google_news: true
    reserve: true
    lookback_hours: 48
    # 초등학교 학부모 관점: 학교 운영·안전·교육과정·급식·학군
    url: "https://news.google.com/rss/search?q=(%22primary+school%22+OR+%22intermediate+school%22+OR+%22school+zone%22+OR+%22school+lunch%22+OR+%22Education+Review+Office%22+OR+%22Erica+Stanford%22)+NZ+when:2d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: gn_nz_business
    name: "Google News"
    section: nz_national
    google_news: true
    url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-NZ&gl=NZ&ceid=NZ:en"

  # ── 이민 전용 ──
  - id: inz_news
    name: "Immigration New Zealand"
    section: nz_immigration
    lookback_hours: 72
    url: "https://www.immigration.govt.nz/about-us/media-centre/news-notifications/rss"
    fallbacks:
      - "https://news.google.com/rss/search?q=site:immigration.govt.nz&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: gn_nz_work_visa
    name: "Google News"
    section: nz_immigration
    google_news: true
    lookback_hours: 48
    # 졸업 후 취업비자·AEWV·Green List
    url: "https://news.google.com/rss/search?q=%22New+Zealand%22+(%22post+study+work%22+OR+%22post-study+work%22+OR+AEWV+OR+%22accredited+employer%22+OR+%22work+visa%22+OR+%22green+list%22)+when:2d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: gn_nz_residence
    name: "Google News"
    section: nz_immigration
    google_news: true
    lookback_hours: 48
    # 영주권·시민권·이민 규정
    url: "https://news.google.com/rss/search?q=%22New+Zealand%22+(%22skilled+migrant%22+OR+%22residence+visa%22+OR+%22resident+visa%22+OR+residency+OR+citizenship+OR+%22Immigration+New+Zealand%22)+when:2d&hl=en-NZ&gl=NZ&ceid=NZ:en"

  # ── 오클랜드 ──
  - id: gn_auckland
    name: "Google News"
    section: nz_auckland
    google_news: true
    url: "https://news.google.com/rss/search?q=Auckland+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: nzh_auckland
    name: "NZ Herald"
    section: nz_auckland
    url: "https://www.nzherald.co.nz/arc/outboundfeeds/rss/section/nz/auckland/?outputType=xml"
    fallbacks: ["https://news.google.com/rss/search?q=site:nzherald.co.nz+Auckland+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: rnz_auckland
    name: "RNZ"
    section: nz_auckland
    google_news: true
    url: "https://news.google.com/rss/search?q=site:rnz.co.nz+Auckland+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
  - id: stuff_auckland
    name: "Stuff"
    section: nz_auckland
    url: "https://www.stuff.co.nz/auckland/rss"
    fallbacks: ["https://news.google.com/rss/search?q=site:stuff.co.nz+Auckland+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: our_auckland
    name: "OurAuckland (Auckland Council)"
    section: nz_auckland
    url: "https://ourauckland.aucklandcouncil.govt.nz/rss"
    fallbacks: ["https://news.google.com/rss/search?q=site:ourauckland.aucklandcouncil.govt.nz&hl=en-NZ&gl=NZ&ceid=NZ:en"]
  - id: auckland_transport
    name: "Auckland Transport"
    section: nz_auckland
    enabled: false   # 선택: 교통 공지가 필요하면 true
    google_news: true
    url: "https://news.google.com/rss/search?q=%22Auckland+Transport%22+when:1d&hl=en-NZ&gl=NZ&ceid=NZ:en"
