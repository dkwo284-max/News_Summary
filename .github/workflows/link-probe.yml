name: Probe Auckland links

# 임시 점검(수동): 오클랜드 탭 안내 링크와 주제별 뉴스 피드. 결과는 link-probe 브랜치에 기록.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          {
          for u in https://www.healthpoint.co.nz/ https://info.health.nz/ https://info.health.nz/eligibility-for-publicly-funded-health-services/ \
            https://www.healthline.govt.nz/ https://www.educationcounts.govt.nz/find-school https://ero.govt.nz/ https://parents.education.govt.nz/ \
            https://www.education.govt.nz/school/school-terms-and-holidays/ https://www.govt.nz/browse/education/school-and-college/school-term-dates/ \
            https://www.105.police.govt.nz/ https://www.police.govt.nz/about-us/publications-statistics/data-and-statistics/policedatanz \
            https://www.tenancy.govt.nz/rent-bond-and-bills/market-rent/ https://geomapspublic.aucklandcouncil.govt.nz/viewer/index.html \
            https://www.qv.co.nz/price-index/ https://www.aucklandcouncil.govt.nz/ https://www.police.govt.nz/; do
            echo "$(curl -s -o /tmp/p -L -m 30 -A "$UA" -w '%{http_code} %{url_effective}' "$u") <= $u :: $(python3 -c "import re;t=open('/tmp/p',errors='ignore').read();m=re.search(r'<title[^>]*>(.*?)</title>',t,re.S|re.I);print((m.group(1).strip() if m else '')[:90])")"
          done
          echo; echo "=== QV Auckland snippet"
          curl -s -L -m 30 -A "$UA" https://www.qv.co.nz/price-index/ | python3 -c "import sys,re;t=sys.stdin.read();f=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t));[print('  ~',f[max(0,m.start()-200):m.start()+300]) for m in list(re.finditer(r'Auckland',f))[:4]]"
          } > /tmp/link-probe.txt 2>&1
          cat /tmp/link-probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan link-probe
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/link-probe.txt .
          git add link-probe.txt && git commit -qm "link probe" && git push -f origin link-probe
