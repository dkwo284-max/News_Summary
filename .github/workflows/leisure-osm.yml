name: Leisure opening hours (OpenStreetMap)

# 레저 시설의 운영 시간·주차장 정보를 OpenStreetMap(Overpass)에서 가져옵니다 (AI 없음).
# Overpass 서버가 느리거나 막힐 때가 있어 요금 수집과 분리했습니다 — 실패해도 다른 데이터에 영향이 없고, 이전 값은 그대로 둡니다.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"   # 매주 수요일 (Overpass 가 느려 한 번에 30~40곳씩, 아직 안 본 시설부터 이어서)

permissions:
  contents: write

jobs:
  osm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch opening hours
        run: python scripts/leisure_osm.py
      - name: Commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/leisure-osm.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: leisure opening hours"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
