name: policy-probe
on:
  push:
    branches: [policy-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          urls = [
           ("https://www.rnz.co.nz/news/politics_election-2026/2368099/residency-overstayers-and-asylum-seekers-parties-set-out-their-stalls", 9000, 3000),
           ("https://www.national.org.nz/news/20261104-christopher-luxon-nationals-manifesto-to-secure-nzs-future", 4000, 0),
           ("https://www.national.org.nz/immigration", 4000, 0),
           ("https://www.greens.org.nz/immigration", 4000, 0),
           ("https://www.nzherald.co.nz/nz/green-party-wants-overhaul-of-broken-immigration-system-amnesty-for-overstayers-and-pathways-to-residency/IYTATEC4MMUK6G7BB6FR5JJ5RA/", 4000, 0),
           ("https://www.rnz.co.nz/news/politics_election-2026/1340334/act-and-nz-first-pitch-tighter-immigration-controls-others-warn-against-anti-immigration-policies", 6000, 0),
           ("https://www.rnz.co.nz/news/politics_election-2026/1940991/migrant-advocacy-group-says-nz-first-has-adopted-its-policy", 3500, 0),
           ("https://www.immigration.govt.nz/about-us/news-centre/final-details-about-changes-to-the-skilled-migrant-category-resident-visa-and-work-to-residence-visa/", 6000, 0),
           ("https://www.rnz.co.nz/news/politics_election-2026/1332164/new-zealand-first-unveils-plans-for-dramatic-overhaul-of-immigration-system", 4500, 3800),
          ]
          for u, n, skip in urls:
              print("=" * 100); print("URL", u)
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (compatible; policy-check)"})
                  raw = urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "ignore")
                  raw = re.sub(r"(?is)<(script|style|nav|header|footer)[^>]*>.*?</\1>", " ", raw)
                  t = html.unescape(re.sub(r"<[^>]+>", " ", raw)); t = re.sub(r"\s+", " ", t)
                  i = max(0, min([m.start() for m in re.finditer(r"(?i)immigra|visa|resid", t)][:1] or [0]) - 200)
                  print(t[i + skip:i + skip + n])
              except Exception as e:
                  print("ERR", e)
          PY
