name: Check processing times

# 이민 레이더 전광판의 처리 기간 수집이 동작하는지 수동으로 점검.
# 결과 JSON 을 processing-check 브랜치에 올린다 (main 데이터는 건드리지 않음).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch processing times (no AI)
        run: python scripts/processing.py > processing-check.json
      - name: Publish result to processing-check branch
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv processing-check.json /tmp/processing-check.json
          git checkout --orphan processing-check
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/processing-check.json .
          git add processing-check.json
          git commit -qm "processing check $(date -u +%FT%TZ)"
          git push -f origin processing-check
