name: Check feeds

# 피드 URL 생존 확인. 수동 실행 또는 매주 월요일.
# 결과는 feed-check 브랜치의 feed-check.txt 에도 올린다 (실패해도).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check feeds
        id: check
        run: |
          set -o pipefail
          python scripts/check_feeds.py --strict 2>&1 | tee /tmp/feed-check.txt
      - name: Publish result to feed-check branch
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan feed-check
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/feed-check.txt .
          git add feed-check.txt
          git commit -qm "feed check $(date -u +%FT%TZ)"
          git push -f origin feed-check
