name: Check feeds

# 피드 URL 생존 확인. 수동 실행 또는 매주 월요일.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 0"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_feeds.py --strict
