name: Whale Radar test run

# 임시(수동): 새 저장소를 만들기 전, whale-radar 브랜치의 코드를 실제 SEC·뉴스로 실행해 보고 결과를 그 브랜치에 커밋.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "build.py 인자"
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: whale-radar }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt pytest && python -m pytest -q
      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build.py ${{ github.event.inputs.args }} 2>&1 | tee build.log
      - name: Commit
        if: always()
        run: |
          git config user.name "whale-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p logs && cp build.log logs/ || true
          for d in web/data cache logs out; do [ -e "$d" ] && git add -f "$d"; done
          git commit -qm "test run data" && git push -q origin HEAD:whale-radar || echo "nothing to commit"
