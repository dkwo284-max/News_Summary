name: World military tension (GDELT)

# 매일 한 번: GDELT 뉴스 데이터로 세계 군사 긴장도·한국/뉴질랜드 노출도를 계산해 web/public/data/tension.json 에 저장.
# 아침 브리핑(뉴질랜드 03:00) 전에 끝나도록 02:37(NZDT) 쯤 실행. AI 호출 없음·키 없음.
on:
  schedule:
    - cron: "37 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 저장 뒤 Pages 배포(deploy.yml) 호출

concurrency:
  group: tension
  cancel-in-progress: false

jobs:
  tension:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q httpx
      - run: python scripts/tension.py
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/tension.json web/public/data/tension-history.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: world military tension"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref=main || echo "deploy dispatch failed (다음 배포 때 반영)"
