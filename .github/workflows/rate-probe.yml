name: Probe policy rates

# 임시 점검(수동): 기준금리 데이터 소스. 결과는 rate-probe 브랜치에 기록.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          UA="Mozilla/5.0 (compatible; DailyBriefBot/1.0)"
          {
          for u in "https://stats.bis.org/api/v1/data/WS_CBPOL/D.NZ+KR+US/all?startPeriod=2025-06-01&format=csv" \
                   "https://stats.bis.org/api/v2/data/dataflow/BIS/WS_CBPOL/1.0/D.NZ+KR+US?startPeriod=2025-06-01&format=csv" \
                   "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFEDTARU" \
                   "https://www.rbnz.govt.nz/monetary-policy/about-monetary-policy/the-official-cash-rate" \
                   "https://www.bok.or.kr/eng/main/main.do" \
                   "https://api.coinbase.com/v2/exchange-rates?currency=USD" \
                   "https://api.coinbase.com/v2/prices/BTC-USD/spot"; do
            echo "=== $u"
            curl -sS -L -m 40 -A "$UA" -o body -w '%{http_code} %{content_type}\n' "$u"
            head -c 1500 body | head -40; echo; echo "--- tail"; tail -c 800 body; echo
          done
          echo "=== BOK base rate text"
          curl -sS -L -m 40 -A "$UA" https://www.bok.or.kr/eng/main/main.do | python3 -c "import sys,re;t=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',sys.stdin.read()));i=t.find('Base Rate');print(t[max(0,i-200):i+400])"
          } > probe.txt 2>&1
          cat probe.txt
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && rm -f body
          git init -q -b rate-probe && git config user.name "daily-brief-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "rate probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rate-probe
