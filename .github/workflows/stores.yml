name: Store locations (Woolworths, Chemist Warehouse)

# 1년에 한 번(또는 수동): OpenStreetMap 에서 울월쓰·케미스트웨어하우스 매장 위치를 받아 web/public/data/stores.json 으로 저장합니다.
# 매장은 잘 안 바뀌므로 매일 도는 실행에는 넣지 않았고, 자동 실행도 파일이 1년 안이면 건너뜁니다. 수동 실행은 항상 새로 받습니다. AI 호출 없음·키 없음.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 12 11 *"

permissions:
  contents: write

jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q httpx
      - run: python scripts/stores.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/stores.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: Woolworths / Chemist Warehouse locations"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
