name: Probe FX sources

# 환율 소스 점검(수동): 갱신 주기와 브라우저 접근(CORS) 허용 여부를 확인해 fx-probe 브랜치에 기록
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          probe() {
            echo "=== $1"
            curl -sS -m 20 -D - -o /tmp/body -H "Origin: https://dkwo284-max.github.io" "$1" | grep -i -E "^(HTTP|access-control-allow-origin|cache-control|age|last-modified|date)" || true
            head -c 600 /tmp/body | tr -d '\n'; echo
          }
          for round in 1 2; do
            echo "##### round $round $(date -u +%FT%TZ)"
            probe "https://api.frankfurter.dev/v1/latest?base=NZD&symbols=KRW"
            probe "https://open.er-api.com/v6/latest/NZD"
            probe "https://api.coinbase.com/v2/exchange-rates?currency=NZD"
            probe "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/nzd.min.json"
            [ $round = 1 ] && sleep 90
          done > /tmp/fx-probe.txt 2>&1
          cat /tmp/fx-probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan fx-probe
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/fx-probe.txt .
          git add fx-probe.txt && git commit -qm "fx probe" && git push -f origin fx-probe
