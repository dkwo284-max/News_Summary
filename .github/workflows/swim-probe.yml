name: swim-probe
on:
  push:
    branches: [swim-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Lists
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          UA = "DailyBriefBot/1.0 (+https://github.com/dkwo284-max/News_Summary)"
          def text(raw):
              t = html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", raw))); return re.sub(r"\s+", " ", t)
          raw = urllib.request.urlopen(urllib.request.Request("https://www.aucklandleisure.co.nz/prices-and-membership/", headers={"User-Agent": UA}), timeout=40).read().decode("utf-8", "ignore")
          t = text(raw)
          print("LEN", len(t))
          for m in re.finditer(r"Pool admission prices Pool admission prices", t):
              pre = t[max(0, m.start() - 260):m.start()]
              post = t[m.end():m.end() + 700]
              print("-" * 60); print("PRE ...", pre[-200:]); print("POST", post)
          PY
