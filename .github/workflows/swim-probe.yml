name: swim-probe
on:
  push:
    branches: [swim-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Lists
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          UA = "DailyBriefBot/1.0 (+https://github.com/dkwo284-max/News_Summary)"
          def text(raw):
              t = html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", raw))); return re.sub(r"\s+", " ", t)
          for u in ["https://www.aucklandleisure.co.nz/umbraco/surface/LocationListing/RenderLocationListing",
                    "https://ourauckland.aucklandcouncil.govt.nz/news/2025/12/make-a-splash-this-summer/",
                    "https://ourauckland.aucklandcouncil.govt.nz/news/2019/12/great-outdoor-swimming-spots-and-splashpads/",
                    "https://aucklandleisure.co.nz/outdoor-pools/", "https://aucklandleisure.co.nz/free-swimming/"]:
              print("=" * 80); print("URL", u)
              try:
                  raw = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=40).read().decode("utf-8", "ignore")
                  print("HREFS", sorted(set(re.findall(r'href="([^"#?]*locations/[^"#?]*)"', raw)))[:80])
                  print("TEXT", text(raw)[:4500])
              except Exception as e:
                  print("ERR", e)
          PY
