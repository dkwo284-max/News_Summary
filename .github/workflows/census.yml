name: Census ethnic map data

# 수동 실행: Stats NZ 2023 인구총조사의 지역별 민족 구성(SA2)을 받아 web/public/data/census-akl.json 으로 저장합니다(5년마다 필요할 때만).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q httpx
      - run: python scripts/census.py
      - name: Commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/census-akl.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: census ethnic distribution (SA2)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
