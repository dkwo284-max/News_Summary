name: Probe Stats NZ census data

# 임시(수동): 지역별 민족 구성 데이터(통계청 인구총조사) 위치 점검. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import re, json, httpx
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": "DailyBriefBot/1.0 (personal project)"})
          for u in ["https://api.data.stats.govt.nz/rest/dataflow/STATSNZ/CEN23_ECI_016/latest?references=all",
                    "https://api.data.stats.govt.nz/rest/dataflow/STATSNZ/CEN23_ECI_016/latest",
                    "https://api.data.stats.govt.nz/rest/datastructure/STATSNZ/all/latest",
                    "https://api.data.stats.govt.nz/rest/data/STATSNZ,CEN23_ECI_016,1.0/all?lastNObservations=1&dimensionAtObservation=AllDimensions&format=csv"]:
              for hdr in [{}, {"Accept": "application/vnd.sdmx.structure+json;version=1.0"}]:
                  r = c.get(u, headers=hdr)
                  print("===", r.status_code, r.headers.get("content-type"), len(r.content), u[-70:], hdr and "structure-accept")
                  print("   ", r.text[:300].replace("\n", " "))
          r = c.get("https://explore.data.stats.govt.nz/")
          for m in sorted(set(re.findall(r'(?:subscription|api[ -]?key|developer)[^"<]{0,120}', r.text, re.I)))[:8]: print("  hint", m)
          PY
          cat probe.txt | cut -c1-300 | head -120
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
