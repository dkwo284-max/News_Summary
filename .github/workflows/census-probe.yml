name: Probe Stats NZ census data

# 임시(수동): 지역별 민족 구성 데이터(통계청 인구총조사) 위치 점검. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import re, json, httpx
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": "DailyBriefBot/1.0 (personal project)"})
          H = {"Accept": "application/vnd.sdmx.structure+json;version=1.0"}
          r = c.get("https://api.data.stats.govt.nz/rest/dataflow/STATSNZ/CEN23_ECI_016/latest?references=all", headers=H)
          print("status", r.status_code, len(r.content))
          j = r.json()
          d = j.get("data", j)
          dsd = (d.get("dataStructures") or [{}])[0]
          dims = dsd.get("dataStructureComponents", {}).get("dimensionList", {}).get("dimensions", [])
          print("DIMS", [(x["id"], x.get("position")) for x in dims])
          cls = {x["id"]: x for x in d.get("codelists", [])}
          for dm in dims:
              ref = dm.get("localRepresentation", {}).get("enumeration", "")
              cid = ref.split(":")[-1].split("(")[0] if ref else ""
              cl = cls.get(cid)
              if cl:
                  codes = cl.get("codes", [])
                  print(f"--- {dm['id']} codelist {cid}: {len(codes)} codes")
                  if dm["id"] in ("ETHNICITY", "ETH", "ETHNIC") or "ETH" in dm["id"].upper() or len(codes) < 60:
                      for cc in codes[:140]: print("     ", cc["id"], "|", cc.get("name") or cc.get("names", {}).get("en"))
                  else:
                      for cc in codes[:5]: print("     ", cc["id"], "|", cc.get("name") or cc.get("names", {}).get("en"))
          PY
          cat probe.txt | cut -c1-300 | head -120
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
