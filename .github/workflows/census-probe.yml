name: Probe Stats NZ census data

# 임시(수동): 지역별 민족 구성 데이터(통계청 인구총조사) 위치 점검. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import re, json, httpx
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": "DailyBriefBot/1.0 (personal project)"})
          r = c.get("https://www.stats.govt.nz/large-datasets/csv-files-for-download/")
          t = r.text
          print("page", r.status_code, len(t))
          hrefs = re.findall(r'href="([^"]+)"', t)
          files = sorted({h for h in hrefs if re.search(r"\.(zip|csv|xlsx)(\?|$)", h, re.I)})
          print("files", len(files))
          for h in files: 
              if re.search(r"2023|census|ethnic", h, re.I): print("  file", h)
          for h in sorted({h for h in hrefs if re.search(r"census", h, re.I)})[:50]: print("  page-link", h)
          i = t.lower().find("2023 census")
          print("ctx:", re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", t[max(0,i-300):i+900]))[:900])
          PY
          cat probe.txt | cut -c1-300 | head -120
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
