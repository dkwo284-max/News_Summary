name: Probe Stats NZ census data

# 임시(수동): 지역별 민족 구성 데이터(통계청 인구총조사) 위치 점검. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import re, json, httpx
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": "DailyBriefBot/1.0 (personal project)"})
          r = c.get("https://api.data.stats.govt.nz/rest/dataflow/STATSNZ/all/latest")
          flows = r.json()["references"]
          rows = [(v["id"], v.get("name", "")) for v in flows.values()]
          print("dataflows", len(rows))
          for i, n in rows:
              ln = n.lower()
              if ("ethnic" in ln or "ethnicity" in ln) and ("census" in ln or "2023" in ln or "area" in ln or "sa2" in ln or "statistical" in ln):
                  print("  FLOW", i, "|", n)
          for i, n in rows:
              if "census" in n.lower() and ("statistical area 2" in n.lower() or "sa2" in n.lower()):
                  print("  SA2FLOW", i, "|", n)
          PY
          cat probe.txt | cut -c1-300 | head -120
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
