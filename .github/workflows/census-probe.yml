name: Probe Stats NZ census data

# 임시(수동): 지역별 민족 구성 데이터(통계청 인구총조사) 위치 점검. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import re, json, httpx
          c = httpx.Client(timeout=120, follow_redirects=True, headers={"User-Agent": "DailyBriefBot/1.0 (personal project)"})
          import json
          base = "https://services2.arcgis.com/vKb0s8tBIA3bdocZ/arcgis/rest/services/2023_Census_population_change_by_ethnic_group_and_SA2/FeatureServer"
          for lyr in (0, 1):
              info = c.get(f"{base}/{lyr}?f=json").json()
              fl = info.get("fields", [])
              print(f"=== layer {lyr}: {info.get('name')} type={info.get('geometryType')} fields={len(fl)} maxRecordCount={info.get('maxRecordCount')}")
              for f in fl[:200]: print("   ", f["name"], "|", f.get("alias"))
          q = c.get(f"{base}/1/query", params={"where": "SA22023_V1_00_NAME LIKE '%Albany%'", "outFields": "*", "returnGeometry": "false", "f": "json"}).json()
          for ft in q.get("features", [])[:3]: print(json.dumps(ft["attributes"], ensure_ascii=False)[:900])
          cnt = c.get(f"{base}/1/query", params={"where": "1=1", "returnCountOnly": "true", "f": "json"}).json()
          print("count layer1", cnt)
          # lookup table 서비스
          r = c.get("https://hub.arcgis.com/api/v3/datasets?q=" + "2023%20Census%20population%20change%20by%20ethnic%20group%20and%20SA2%20lookup%20table" + "&page[size]=3")
          for it in r.json().get("data", []):
              a2 = it.get("attributes", {}); print("LOOKUP", a2.get("name"), a2.get("url"), a2.get("itemId"), a2.get("type"))
          PY
          cat probe.txt | cut -c1-300 | head -120
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
