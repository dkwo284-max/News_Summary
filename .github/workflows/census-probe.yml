name: Probe Stats NZ detailed ethnicity (needs STATSNZ_API_KEY)

# 임시(수동): 상세 민족 표 CEN23_ECI_016 구조 점검. 키는 출력하지 않는다. 결과는 census-probe 브랜치.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      STATSNZ_API_KEY: ${{ secrets.STATSNZ_API_KEY }}
    steps:
      - name: Probe
        run: |
          pip install -q httpx
          mkdir -p /tmp/out && cd /tmp/out
          python3 - > probe.txt 2>&1 <<'PY'
          import os, json, httpx
          key = os.environ.get("STATSNZ_API_KEY", "").strip()
          print("key present:", bool(key), "length:", len(key))
          if not key: raise SystemExit("no key")
          c = httpx.Client(timeout=180, follow_redirects=True, headers={"Ocp-Apim-Subscription-Key": key, "User-Agent": "DailyBriefBot/1.0 (personal project)"})
          r = c.get("https://api.data.stats.govt.nz/rest/dataflow/STATSNZ/CEN23_ECI_018/latest?references=all", headers={"Accept": "application/vnd.sdmx.structure+json;version=1.0"})
          print("structure ECI_018", r.status_code, len(r.content))
          d = r.json().get("data", {})
          dsd = d["dataStructures"][0]
          dims = dsd["dataStructureComponents"]["dimensionList"]["dimensions"]
          print("DIMS", [(x["id"], x["position"]) for x in dims])
          cls = {x["id"]: x for x in d.get("codelists", [])}
          nm = lambda cc: cc.get("name") or (cc.get("names") or {}).get("en")
          for dm in dims:
              ref = dm.get("localRepresentation", {}).get("enumeration", "")
              cl = cls.get(ref.split("=")[-1].split(":")[-1].split("(")[0])
              if not cl: continue
              codes = cl["codes"]
              print(f"--- {dm['id']} {len(codes)} codes")
              if "ETH" in dm["id"]:
                  for cc in codes: print("    ", cc["id"], "|", nm(cc), "| parent:", cc.get("parent"))
              elif "GEO" in dm["id"]:
                  for cc in codes:
                      n = nm(cc) or ""
                      if "Auckland" in n or "Local Board" in n or "Board" in n: print("    ", cc["id"], "|", n, "| parent:", cc.get("parent"))
              else:
                  for cc in codes[:6]: print("    ", cc["id"], "|", nm(cc))
          PY
          cut -c1-220 probe.txt | head -220
      - name: Publish
        if: always()
        run: |
          cd /tmp/out && git init -q -b census-probe && git config user.name bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" census-probe
