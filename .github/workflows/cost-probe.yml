name: Probe living-cost sources

# 오클랜드 생활비판 데이터 소스 점검(수동). 결과는 cost-probe 브랜치에 기록.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          UA="Mozilla/5.0 (compatible; DailyBriefBot/1.0)"
          {
          echo "=== rental bond csv links"
          curl -sS -L -m 30 -A "$UA" https://www.tenancy.govt.nz/about-tenancy-services/data-and-statistics/rental-bond-data/ | grep -o -i -E 'href="[^"]+\.(csv|zip)[^"]*"' | sort -u
          TA=$(curl -sS -L -m 30 -A "$UA" https://www.tenancy.govt.nz/about-tenancy-services/data-and-statistics/rental-bond-data/ | grep -o -i -E 'href="[^"]+\.csv[^"]*"' | grep -i -E 'territor|tla|ta-' | head -1 | sed 's/href="//;s/"$//')
          echo "TA link: $TA"
          case "$TA" in http*) ;; *) TA="https://www.tenancy.govt.nz$TA";; esac
          curl -sS -L -m 60 -A "$UA" -o /tmp/ta.csv "$TA"; echo "size $(wc -c < /tmp/ta.csv)"
          head -3 /tmp/ta.csv | cut -c1-600
          echo "--- last Auckland rows"; grep -i auckland /tmp/ta.csv | tail -3 | cut -c1-600
          echo; echo "=== MBIE fuel last rows (Board price)"
          curl -sS -L -m 60 -A "$UA" -o /tmp/f.csv https://www.mbie.govt.nz/assets/Data-Files/Energy/Weekly-fuel-price-monitoring/weekly-table.csv
          grep -i "Board price" /tmp/f.csv | tail -6
          echo; echo "=== OCR alternatives"
          for u in https://www.interest.co.nz/charts/interest-rates/ocr https://www.interest.co.nz/charts/interest-rates/official-cash-rate https://www.stats.govt.nz/indicators/unemployment-rate/; do
            echo "--- $u $(curl -sS -L -m 30 -A "$UA" -o /tmp/o -w '%{http_code}' "$u")"
            python3 -c "import re;t=open('/tmp/o',errors='ignore').read();f=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t));[print('  ~',f[max(0,m.start()-150):m.start()+250]) for m in list(re.finditer(r'(cash rate|OCR|unemployment rate)[^.]{0,80}\d',f,re.I))[:3]]"
          done
          } > /tmp/cost-probe.txt 2>&1
          cat /tmp/cost-probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan cost-probe
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/cost-probe.txt .
          git add cost-probe.txt && git commit -qm "cost probe" && git push -f origin cost-probe
