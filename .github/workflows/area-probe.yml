name: Probe area data

# 임시 점검(수동): 동네 비교용 데이터 소스. 결과는 area-probe 브랜치에 기록.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe
        run: |
          pip install -q -r requirements.txt
          python scripts/areas.py Milford "Mt Eden" Takapuna Albany > /tmp/area-probe.txt 2>&1; cat /tmp/area-probe.txt
      - name: Publish
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan area-probe
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/area-probe.txt .
          git add area-probe.txt && git commit -qm "area probe" && git push -f origin area-probe
