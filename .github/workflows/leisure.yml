name: Leisure fees (golf, sailing, kayak, fishing)

# 1년에 한 번(9월 중순) 또는 수동: 레저 시설 공식 페이지에서 요금표를 읽어 web/public/data/leisure.json 으로 만듭니다.
# 좌표는 OpenStreetMap(Nominatim), 요금은 Gemini 로 추출한 뒤 금액이 페이지 글에 실제로 있는지 검증합니다(시설 10곳당 AI 요청 1회).
# 자동 실행은 파일이 330일 안에 만든 것이면 건너뜁니다. 수동 실행은 항상 새로 읽습니다. 매일 도는 실행에는 들어 있지 않습니다.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "일부 시설만(쉼표로 구분한 id, 예: g-wainui,g-pupuke). 비우면 전체"
        default: ""
      ignore_cap:
        description: "AI 공용 예산 무시 (예산이 모자라 건너뛰었을 때 한 번만)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 15 9 *"

permissions:
  contents: write

jobs:
  leisure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build leisure.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROFILE: production   # 요금 추출은 정확도가 중요해서 Flash 우선 (1년에 한 번)
          ONLY: ${{ github.event.inputs.only }}
          STALE: ${{ github.event_name == 'schedule' && '--if-stale' || '' }}
          CAP: ${{ github.event.inputs.ignore_cap == 'true' && '--ignore-cap' || '' }}
        run: python scripts/leisure.py $STALE $CAP ${ONLY:+--only "$ONLY"}
      - name: Commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/leisure.json web/public/data/ai-usage.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: leisure fees"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
