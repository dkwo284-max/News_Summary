name: Leisure fees (golf, sailing, kayak, fishing)

# 1월·7월·9월 10일(9월은 요트·보트 클럽 새 시즌 직후) 또는 수동: 레저 시설 공식 페이지를 받아 web/public/data/leisure.json 을 갱신합니다.
# 요금은 잘 안 바뀌므로 페이지 글의 "지문"이 이전과 같으면 AI 를 쓰지 않고(보통 AI 0회), 바뀐 시설만 Gemini 로 다시 읽은 뒤
# 금액이 페이지 글에 실제로 있는지 검증합니다(시설 3곳당 AI 1회). 요금·가입 상태가 바뀌면 기록하고 알림(설정에서 켠 경우).
# 매일 도는 실행에는 들어 있지 않습니다.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "일부 시설만(쉼표로 구분한 id, 예: g-wainui,g-pupuke). 비우면 전체"
        default: ""
      seed_hashes:
        description: "이미 읽어 둔 값의 페이지 지문만 기록 (AI 없음, 처음 한 번)"
        type: boolean
        default: false
      details:
        description: "방문 정보(예약·주차·준비물·운영 시간)를 아직 안 읽은 시설을 다시 읽기 (AI 사용, 한 번만)"
        type: boolean
        default: false
      ignore_cap:
        description: "AI 공용 예산 무시 (예산이 모자라 건너뛰었을 때 한 번만)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 10 1,7,9 *"

permissions:
  contents: write

jobs:
  leisure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build leisure.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROFILE: test   # Flash-Lite 우선 (하루 500회 한도) — 금액은 페이지 글과 대조해 검증하므로 Lite 로 충분
          ONLY: ${{ github.event.inputs.only }}
          SEED: ${{ github.event.inputs.seed_hashes == 'true' && '--seed-hashes' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          CAP: ${{ github.event.inputs.ignore_cap == 'true' && '--ignore-cap' || '' }}
          DETAILS: ${{ github.event.inputs.details == 'true' && '--details' || '' }}
        run: python scripts/leisure.py $SEED $CAP $DETAILS ${ONLY:+--only "$ONLY"}
      - name: Opening hours from OpenStreetMap (no AI)
        continue-on-error: true
        run: python scripts/leisure_osm.py
      - name: Commit
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/leisure.json web/public/data/leisure-osm.json web/public/data/ai-usage.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: leisure fees"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
