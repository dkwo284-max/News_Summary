name: Daily Brief

on:
  schedule:
    # 주 실행은 cron-job.org 가 뉴질랜드 시간 04:55에 workflow_dispatch로 실행.
    # 아래는 GitHub 예약 보조 실행: 05:05 / 05:20 / 05:35 목표.
    #
    # 뉴질랜드 서머타임 NZDT (UTC+13): 16:05 / 16:20 / 16:35 UTC
    # 뉴질랜드 표준시 NZST (UTC+12): 17:05 / 17:20 / 17:35 UTC
    #
    # DST 전환을 고려해 두 UTC 시간대를 모두 등록.
    # scripts/main.py에서 현지 시간 및 오늘 브리핑 생성 여부를 확인해야 함.
    - cron: "5,20,35 16,17 * * *"
    # 아침 안에 완성 보장: 30분마다(05:25~08:55 NZDT) 복구 실행. 브리핑이 아직 없으면 생성하고, 있으면 실패한 단계만 다시,
    # 멀쩡하면 몇 초 만에 종료. 두 UTC 대역(16~20시)을 등록해 서머타임/표준시 모두 04:00~09:00 NZ 를 덮는다.
    # (GitHub 예약은 자주 10~30분 늦어지므로 간격을 촘촘히 둔다. 시각 창 밖이면 main.py 가 건너뜀)
    - cron: "25,55 16-20 * * *"
    # 마지막 안전망: NZDT 10:10 / 14:10 (표준시 09:10 / 13:10) — 실패한 단계만 다시
    - cron: "10 21 * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "시각 조건을 무시하고 지금 생성 (오늘 파일이 있으면 덮어씀)"
        type: boolean
        default: true
      processing_only:
        description: "뉴스·AI 없이 비자 처리 기간 전광판만 갱신"
        type: boolean
        default: false
      overwrite:
        description: "오늘 브리핑이 이미 있어도 다시 생성 (AI 요청이 다시 소모됨)"
        type: boolean
        default: false
      repair:
        description: "실패한 단계만 복구 (요약·영향 분석 중 실패한 것만 다시, AI 1~3회). 오늘 브리핑이 멀쩡하면 아무것도 안 함"
        type: boolean
        default: false
      ignore_cap:
        description: "AI 공용 예산(남은 몫) 무시 — 오늘 AI 호출이 서버 오류로 실패해 브리핑이 영어·휴리스틱으로 나왔을 때 한 번만"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      generated: ${{ steps.run.outputs.generated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate brief
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # 기본: Gemini 무료 등급
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # config.yaml 에서 provider: anthropic 일 때만 사용
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 정해진 시각의 실제 배포(예약·cron-job.org 의 force=false)는 Flash, 수동 '지금 생성'(force=true) 같은 테스트는 Flash-Lite
          AI_PROFILE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)) && 'production' || 'test' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.processing_only && '--update-processing' || '' }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && !inputs.overwrite && '--skip-existing' || '' }}  # 수동·외부 호출이 겹쳐도 하루 한 번만 AI 소모
          CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_cap && '--ignore-cap' || '' }}
          REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.repair && '--retry-degraded' || '' }}
          RETRY: ${{ (github.event.schedule == '25,55 16-20 * * *' || github.event.schedule == '10 21 * * *' || github.event.schedule == '10 1 * * *') && '--retry-degraded' || '' }}
        run: python scripts/main.py $FORCE $ONLY $SKIP $CAP $RETRY $REPAIR

      - name: Commit data
        if: steps.run.outputs.generated == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: ${{ steps.run.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # 빠른 복구: 방금 만든 브리핑이 AI 과부하로 원문 대체(degraded)면, 몇 분 쉬었다가 같은 실행 안에서 실패한 단계만 한 번 더.
      # (GitHub 예약 복구는 자주 늦거나 빠져서, 예약에 기대지 않고 바로 다시 시도한다. 브리핑이 멀쩡하면 몇 초 만에 끝남)
      - name: Quick repair if degraded
        id: fix
        if: steps.run.outputs.generated == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.processing_only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROFILE: production
        run: |
          deg=$(python - <<'PY'
          import json, glob
          f = sorted(glob.glob("web/public/data/20??-??-??.json"))[-1]
          print("yes" if (json.load(open(f, encoding="utf-8")).get("meta") or {}).get("degraded") else "no")
          PY
          )
          if [ "$deg" != "yes" ]; then echo "brief is fine"; exit 0; fi
          echo "degraded — retrying failed steps in 4 minutes"
          sleep 240
          python scripts/main.py --retry-degraded || true

      - name: Commit repair
        if: steps.fix.outcome == 'success'
        run: |
          git add web/public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: quick repair"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily Brief 생성 실패"
          body="실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          시각(UTC): $(date -u +%FT%TZ)
          종료 코드 2 = 기사 0건, 3 = 스키마 검증 실패. 로그에서 'feed failed' 줄로 실패한 피드를 확인하세요."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    needs: brief
    if: needs.brief.outputs.generated == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
