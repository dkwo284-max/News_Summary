name: Daily Brief

on:
  schedule:
    # 주 실행은 cron-job.org 가 뉴질랜드 시간 03:00에 workflow_dispatch로 실행.
    # 아래는 GitHub 예약 보조 생성: 03:10 / 03:25 / 03:40 목표 (브리핑이 이미 있으면 몇 초 만에 종료).
    #
    # 뉴질랜드 서머타임 NZDT (UTC+13): 14:10 / 14:25 / 14:40 UTC
    # 뉴질랜드 표준시 NZST (UTC+12): 15:10 / 15:25 / 15:40 UTC
    # DST 전환을 고려해 두 UTC 시간대를 모두 등록. 현지 시각 창(03:00~08:59)은 scripts/main.py 가 확인.
    - cron: "10,25,40 14,15 * * *"
    # 아침 안에 완성 보장: 30분마다(03:25~08:55 NZDT) 복구 실행. 브리핑이 아직 없으면 생성하고, 있으면 실패한 단계만 다시,
    # 멀쩡하면 몇 초 만에 종료. 두 UTC 대역(14~20시)을 등록해 서머타임/표준시 모두 03:00~09:00 NZ 를 덮는다.
    # (GitHub 예약은 자주 10~30분 늦어지므로 간격을 촘촘히 둔다. 시각 창 밖이면 main.py 가 건너뜀)
    - cron: "25,55 14-20 * * *"
    # 늦은 안전망: 현지 11:00 / 12:00 / 13:00 / 14:00 매시 정각 (14시에 끝). 오늘 브리핑이 아직 없거나 요약·분석이 실패했을 때만 움직이고,
    # 제대로 끝났으면 몇 초 만에 종료. 서머타임(NZDT=UTC+13)은 22·23·0·1시 UTC, 표준시(NZST=UTC+12)는 23·0·1·2시 UTC 라
    # 22~2시 UTC 를 모두 등록하고, 현지 11:00~14:29 밖(서머타임 15시·표준시 10시)은 scripts/main.py 가 건너뜀.
    - cron: "0 22,23,0,1,2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "시각 조건을 무시하고 지금 생성 (오늘 파일이 있으면 덮어씀)"
        type: boolean
        default: true
      processing_only:
        description: "뉴스·AI 없이 비자 처리 기간 전광판만 갱신"
        type: boolean
        default: false
      overwrite:
        description: "오늘 브리핑이 이미 있어도 다시 생성 (AI 요청이 다시 소모됨)"
        type: boolean
        default: false
      repair:
        description: "실패한 단계만 복구 (요약·영향 분석 중 실패한 것만 다시, AI 1~3회). 오늘 브리핑이 멀쩡하면 아무것도 안 함"
        type: boolean
        default: false
      late:
        description: "늦은 안전망(현지 11~14시): 오늘 브리핑이 없거나 요약이 실패했을 때만 다시. cron-job.org 가 11·12·13·14시에 호출 (GitHub 예약은 몇 시간씩 늦는 날이 있음)"
        type: boolean
        default: false
      ignore_cap:
        description: "AI 공용 예산(남은 몫) 무시 — 오늘 AI 호출이 서버 오류로 실패해 브리핑이 영어·휴리스틱으로 나왔을 때 한 번만"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write   # 복구 루프가 고칠 때마다 Pages 배포(deploy.yml)를 바로 호출

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # 복구 루프가 새벽 내내 돌 수 있게 (공개 저장소라 Actions 시간 무료)
    outputs:
      generated: ${{ steps.run.outputs.generated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate brief
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # 기본: Gemini 무료 등급
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # config.yaml 에서 provider: anthropic 일 때만 사용
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 정해진 시각의 실제 배포(예약·cron-job.org 의 force=false)는 Flash, 수동 '지금 생성'(force=true) 같은 테스트는 Flash-Lite
          AI_PROFILE: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.force)) && 'production' || 'test' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.processing_only && '--update-processing' || '' }}
          SKIP: ${{ github.event_name == 'workflow_dispatch' && !inputs.overwrite && !inputs.late && '--skip-existing' || '' }}  # 수동·외부 호출이 겹쳐도 하루 한 번만 AI 소모
          CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_cap && '--ignore-cap' || '' }}
          REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.repair && '--retry-degraded' || '' }}
          RETRY: ${{ github.event.schedule == '25,55 14-20 * * *' && '--retry-degraded' || ((github.event.schedule == '0 22,23,0,1,2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.late)) && '--retry-late' || '') }}
        run: python scripts/main.py $FORCE $ONLY $SKIP $CAP $RETRY $REPAIR

      - name: Commit data
        if: steps.run.outputs.generated == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: ${{ steps.run.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # 첫 브리핑을 커밋하자마자 사이트에 배포 (복구 루프가 길게 돌아도 화면은 바로 갱신되게)
      - name: Deploy now
        if: steps.run.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref="${GITHUB_REF_NAME}" || echo "deploy dispatch failed (최종 deploy 작업이 다시 배포함)"

      # 아침 7시 전 완성 루프: 오늘 브리핑이 AI 오류로 일부 실패(degraded)면, GitHub 예약(자주 늦거나 빠짐)에 기대지 않고
      # 같은 실행 안에서 실패한 탭만 계속 다시 시도한다. 5·10·15·20·25…분 간격, 최대 10회, 뉴질랜드 06:50 까지(또는 성공·재시도 상한까지).
      # 한 번 고칠 때마다 바로 커밋해 화면에 반영. 브리핑이 멀쩡하면 몇 초 만에 끝남.
      - name: Repair loop until 06:50 NZ
        id: fix
        if: always() && steps.run.outcome == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.processing_only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROFILE: production
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state() { python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("Pacific/Auckland"))
          f = f"web/public/data/{now.date().isoformat()}.json"
          if not os.path.exists(f):
              print("none"); raise SystemExit
          m = json.load(open(f, encoding="utf-8")).get("meta") or {}
          late = now.hour > 6 or (now.hour == 6 and now.minute >= 50)
          print("fine" if not m.get("degraded") else ("late" if late else "degraded"))
          PY
          }
          waits=(300 600 900 1200 1500 1500 1500 1800 1800 1800)   # 10회, 5·10·15·20·25·25·25·30·30·30분 간격(합 215분: 03:20 시작 → 약 06:55)
          for i in "${!waits[@]}"; do
            st=$(state); echo "state: $st"
            [ "$st" = "degraded" ] || break
            echo "attempt $((i + 1)): waiting ${waits[$i]}s"; sleep "${waits[$i]}"
            [ "$(state)" = "late" ] && { echo "past 06:50 — leaving it to scheduled repairs"; break; }
            git pull -q --rebase origin "${GITHUB_REF_NAME}" || true
            python scripts/main.py --retry-degraded || true
            git add web/public/data
            if ! git diff --cached --quiet; then
              git commit -q -m "brief: repair $((i + 1))"
              for j in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((j * 5)); done
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref="${GITHUB_REF_NAME}" || echo "deploy dispatch failed"   # 고칠 때마다 사이트에 바로 반영
            fi
          done
          fin=$(state); echo "final: $fin"
          # 아침 안에 못 고쳤으면(또는 오늘 브리핑이 아직 없으면) 11시 늦은 재시도를 직접 예약 — GitHub 예약·외부 cron 에 기대지 않음.
          # 이미 대기 중인 늦은 재시도가 있으면 또 만들지 않는다.
          hr=$(( 10#$(TZ=Pacific/Auckland date +%H) ))
          if [ "$fin" != "fine" ] && [ "$hr" -ge 3 ] && [ "$hr" -lt 14 ]; then
            busy=$(gh run list --workflow late-retry.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "${busy:-0}" = "0" ]; then gh workflow run late-retry.yml --ref "${GITHUB_REF_NAME}" -f hour=11 && echo "late retry scheduled for 11:00 NZ"; else echo "late retry already pending"; fi
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily Brief 생성 실패"
          body="실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          시각(UTC): $(date -u +%FT%TZ)
          종료 코드 2 = 기사 0건, 3 = 스키마 검증 실패. 로그에서 'feed failed' 줄로 실패한 피드를 확인하세요."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    needs: brief
    if: needs.brief.outputs.generated == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
