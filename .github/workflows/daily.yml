name: Daily Brief

on:
  schedule:
    # 주 실행은 cron-job.org 가 06:00(NZ)에 보내는 workflow_dispatch. 아래는 GitHub 예약(보조, 가끔 누락됨).
    # 뉴질랜드 시간 06:05 / 06:20 / 06:35 (cron 은 UTC 기준)
    #   서머타임 NZDT(UTC+13, 9월 말~4월 초): 17:05/17:20/17:35 UTC
    #   표준시   NZST(UTC+12, 4월 초~9월 말): 18:05/18:20/18:35 UTC
    # 두 시간대를 모두 걸어두고, scripts/main.py 가 현지 06~07시대이고 오늘 브리핑이 없을 때만 생성한다.
    - cron: "5,20,35 17,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "시각 조건을 무시하고 지금 생성 (오늘 파일이 있으면 덮어씀)"
        type: boolean
        default: true
      processing_only:
        description: "뉴스·AI 없이 비자 처리 기간 전광판만 갱신"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      generated: ${{ steps.run.outputs.generated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate brief
        id: run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}          # 기본: Gemini 무료 등급
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}    # config.yaml 에서 provider: anthropic 일 때만 사용
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.processing_only && '--update-processing' || '' }}
        run: python scripts/main.py $FORCE $ONLY

      - name: Commit data
        if: steps.run.outputs.generated == 'true'
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "brief: ${{ steps.run.outputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Daily Brief 생성 실패"
          body="실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          시각(UTC): $(date -u +%FT%TZ)
          종료 코드 2 = 기사 0건, 3 = 스키마 검증 실패. 로그에서 'feed failed' 줄로 실패한 피드를 확인하세요."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  deploy:
    needs: brief
    if: needs.brief.outputs.generated == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
