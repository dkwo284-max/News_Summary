<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>주말 나들이</title>
    <meta name="description" content="오클랜드 가족 나들이: 주말 코스, 지도, 요금·운영 시간, 회원권 비교" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="./leisure.webmanifest" />
    <link rel="icon" href="./icons/leisure.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="주말 나들이" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("daily-brief:settings") || "{}");
        if (s.theme && s.theme !== "system") document.documentElement.setAttribute("data-theme", s.theme);
        if (s.fontScale) document.documentElement.style.setProperty("--font-scale", s.fontScale);
      } catch (e) {}
    </script>
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <div>
          <h1 class="brand">주말 나들이</h1>
          <p class="when" id="when">불러오는 중…</p>
        </div>
        <a class="icon-btn" href="./" aria-label="데일리 브리프로" title="데일리 브리프" style="text-decoration:none;font-size:1.2rem;display:grid;place-items:center">📰</a>
      </div>
    </header>
    <main id="main" tabindex="-1" aria-busy="true"><p class="muted">나들이 정보를 불러오는 중…</p></main>
    <footer class="foot"><p>요금은 각 시설 공식 페이지, 운영 시간은 OpenStreetMap·공식 페이지, 날씨는 Open-Meteo 기준입니다. 가기 전에 공식 사이트로 한 번 더 확인하세요.</p></footer>
    <script type="module" src="./src/leisure-app.ts"></script>
  </body>
</html>
